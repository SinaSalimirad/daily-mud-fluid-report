name: daily-mud-fluid-report-dev

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

services:
  nginx:
    container_name: nginx
    image: nginx:1.30.6-trixie

    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"

    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - web
      - api

    networks:
      - frontend

    restart: unless-stopped

  api:
    container_name: api
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile

    env_file:
      - ../../.env

    expose:
      - "4000"

    networks:
      - frontend
      - backend

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  web:
    container_name: web

    build:
      context: ../..
      dockerfile: apps/web/Dockerfile

    expose:
      - "3000"

    networks:
      - frontend

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  postgres:
    container_name: postgres
    image: postgres:18.6-bookworm

    volumes:
      - postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    networks:
      - backend

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    
volumes:
  postgres_data:
    driver: local