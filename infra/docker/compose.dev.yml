networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

services:
  postgres:
    container_name: postgres
    image: postgres:18.6-bookworm
    volumes:
      - postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_DB: ${DB_NAME:?POSTGRES_DB is required}
      POSTGRES_USER: ${DB_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?POSTGRES_PASSWORD is required}
    
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    networks:
      - backend

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: '512m'
    
volumes:
  postgres_data:
    driver: local